.hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr 54px 1fr;gap:6px;align-items:start;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}
.plate{background:var(--pcard) center/100% 100% no-repeat;padding:6px 10px 9px;min-width:0}
.plate b{display:block;font:900 13px Cinzel,Georgia,serif;color:#ffe7a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.plate.r{text-align:right}
.hpw{position:relative;height:14px;margin-top:4px;background:#000a;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 1px #ffd86a77}
.hpw i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#8cf08f,#2f9a3e);transition:width .12s}
.hpw u{position:absolute;inset:0 auto 0 0;background:#ffe7a3;opacity:.7;transition:width .6s .25s}
.plate.r .hpw i,.plate.r .hpw u{inset:0 0 0 auto}
.mtr{height:5px;margin-top:3px;background:#0008;border-radius:3px;overflow:hidden}
.mtr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7a5bff,#c88aff);box-shadow:0 0 6px #c88aff}
.mtr.full i{animation:mfull .6s infinite alternate}
@keyframes mfull{to{filter:brightness(1.6)}}
.clock{justify-self:center;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:900 22px Cinzel,Georgia,serif;color:#2b1d0e;
  background:radial-gradient(circle at 35% 30%,#fff3c4,#d8b25a 60%,#8a5f17);box-shadow:0 0 0 3px #3a2408,0 0 0 5px #ffd86a,0 4px 12px #000a}
.clock.low{color:#7a0e06;animation:mfull .5s infinite alternate}
/* big centre messages: ROUND / FIGHT / K.O. */
.big{position:absolute;left:50%;top:44%;translate:-50% -50%;font:900 44px Cinzel,Georgia,serif;letter-spacing:.06em;color:#ffe7a3;
  text-shadow:0 0 18px #ffb347,0 4px 0 #6b3a08,0 8px 18px #000;white-space:nowrap;pointer-events:none;opacity:0}
.big.on{animation:bigin .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes bigin{from{opacity:0;scale:2.4}to{opacity:1;scale:1}}
.stamp{position:absolute;left:50%;top:46%;translate:-50% -50%;width:min(78vw,340px);aspect-ratio:2.3;display:grid;place-items:center;
  background:var(--win) center/100% 100% no-repeat;font:900 26px Cinzel,Georgia,serif;color:#3a2408;opacity:0;pointer-events:none}
.stamp.lose{background-image:var(--lose);color:#ffd9d0;text-shadow:0 2px 3px #000}
.stamp.on{animation:bigin .45s ease-out forwards}
.dmg{position:absolute;font:900 22px Cinzel,Georgia,serif;color:#fff;text-shadow:0 0 6px #ff6a3a,0 2px 3px #000;pointer-events:none;animation:dmg .8s ease-out forwards}
.dmg.crit{color:#ffd86a;font-size:30px}
.dmg.blk{color:#9cc8ff;font-size:16px}
@keyframes dmg{from{translate:-50% 0;scale:1.4}to{translate:-50% -46px;opacity:0;scale:1}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .18s ease-out}
@keyframes fl{from{opacity:.55}to{opacity:0}}
/* ---------- controls: Shadow Fight / Mortal Kombat style overlay ----------
   Everything is drawn for a 400 px reference screen and zoomed by --z, which JS sets from the real
   screen size (short side in landscape, width in portrait) — so buttons are the same share of the
   screen on every phone, even when a host renders the page zoomed out. */
#pad{position:absolute;inset:0;pointer-events:none;z-index:3}
.acts,.joy{position:absolute;pointer-events:none;zoom:var(--z,1)}
/* LEFT: floating joystick — touch anywhere in the left zone, it appears under your thumb */
.jzone{position:absolute;left:0;bottom:0;width:42%;height:70%;pointer-events:auto;touch-action:none}
.joy{left:30px;bottom:30px;width:150px;height:150px;border-radius:50%;transition:opacity .2s;
  background:radial-gradient(circle,#0b162655 40%,#0b1626aa 70%);box-shadow:inset 0 0 0 3px #c9952eaa,0 0 0 2px #3a2408aa,0 8px 20px #0007}
.joy::before,.joy::after{content:'';position:absolute;top:50%;translate:0 -50%;border:10px solid transparent;opacity:.75}   /* ◀ ▶ marks */
.joy::before{left:10px;border-right:14px solid #ffd86a;border-left:0}.joy::after{right:10px;border-left:14px solid #ffd86a;border-right:0}
.knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#fff3c4,#e2b55a 55%,#8a5f17);box-shadow:0 0 0 3px #3a2408,0 0 0 5px #c9952e,0 6px 14px #000a}
.joy.on{box-shadow:inset 0 0 0 3px #ffd86a,0 0 0 2px #3a2408,0 0 22px #ffd86a66}
/* RIGHT: big STRIKE at the thumb rest, three smaller buttons on an arc (180° / 135° / 90°, radius 124) */
.acts{right:calc(env(safe-area-inset-right) / var(--z,1) + 30px);bottom:30px;width:240px;height:240px}
.btn{position:absolute;pointer-events:auto;border:0;border-radius:50%;display:grid;place-items:center;color:#2b1d0e;font:900 13px Cinzel,Georgia,serif;letter-spacing:.02em;opacity:.92;
  background:radial-gradient(circle at 35% 28%,#fff3c4,#e2b55a 55%,#8a5f17);box-shadow:0 0 0 3px #3a2408,0 0 0 5px #c9952e,0 6px 0 #2a1a06,0 10px 18px #000b;touch-action:none}
.btn::after{content:'';position:absolute;inset:-8px;border-radius:inherit}     /* touch zone a bit bigger than the art */
.btn:active,.btn.dn{opacity:1;translate:0 4px;box-shadow:0 0 0 3px #3a2408,0 0 0 5px #ffd86a,0 2px 0 #2a1a06,0 0 22px #ffd86a}
.acts .btn{width:78px;height:78px}
.b-atk{width:110px!important;height:110px!important;right:0;bottom:0;font-size:17px!important}
.b-hvy{right:140px;bottom:16px}
.b-blk{right:104px;bottom:104px;background:radial-gradient(circle at 35% 28%,#e6f2ff,#7aa6d9 55%,#1f3d66)!important;color:#08182b}
.b-sp{right:16px;bottom:140px;background:radial-gradient(circle at 35% 28%,#f0e0ff,#a274e6 55%,#3d1f66)!important;color:#1a0b2b;opacity:.5}
.b-sp.ready{opacity:.95;animation:spr 1s infinite alternate}
@keyframes spr{to{box-shadow:0 0 0 3px #3a2408,0 0 0 5px #c88aff,0 6px 0 #2a1a06,0 0 24px #c88aff}}
/* portrait: lift both clusters off the bottom edge into the thumb zone */
@media (orientation:portrait){.joy{left:22px;bottom:110px}.acts{right:22px;bottom:110px}}
/* gesture tip: under the timer, fades after a few seconds */
.hint{position:absolute;left:50%;translate:-50% 0;top:calc(env(safe-area-inset-top) + 74px);zoom:var(--k,1);padding:4px 10px;border-radius:99px;background:#0008;font-size:11px;color:#fffc;pointer-events:none;white-space:nowrap;transition:opacity 1s}
.hint.off{opacity:0}
/* portrait: suggest turning the phone (fighting games play sideways) */
.rot{position:absolute;left:50%;translate:-50% 0;top:calc(env(safe-area-inset-top) + 104px);zoom:var(--k,1);display:none;padding:6px 12px;border-radius:99px;border:0;
  background:#0b1626dd;color:#ffe7a3;font:700 11px system-ui;white-space:nowrap;box-shadow:0 0 0 1px #ffd86a88;pointer-events:auto;z-index:4}
@media (orientation:portrait){.rot{display:block}}
.rot.off{display:none!important}
/* HUD and pop-ups follow the same UI scale */
.hud,.gear,.load,.end .card,.big,.stamp{zoom:var(--k,1)}
/* hero select */
.sel{position:absolute;inset:0;display:none;z-index:6;place-content:center;justify-items:center;gap:14px;background:radial-gradient(ellipse at 50% 30%,#1d3557ee,#05090fee)}
.sel.on{display:grid}
.sel h2{margin:0;font:900 24px Cinzel,Georgia,serif;color:#ffe7a3;letter-spacing:.06em;text-shadow:0 2px 6px #000;zoom:var(--k,1)}
.selg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:96vw;zoom:var(--k,1)}
.hc{width:150px;display:grid;justify-items:center;gap:4px;padding:10px 8px 12px;border:0;border-radius:16px;color:#fff;cursor:pointer;
  background:linear-gradient(#1d3557,#0b1626);box-shadow:0 0 0 2px #c9952e,0 8px 20px #000a;transition:translate .15s,box-shadow .15s}
.hc:hover,.hc:active{translate:0 -4px;box-shadow:0 0 0 2px #ffd86a,0 0 22px #ffd86a77}
.hc img{width:112px;height:112px}
.hc b{font:900 16px Cinzel,Georgia,serif;color:#ffe7a3}.hc i{font:700 11px system-ui;color:#9cc8ff;letter-spacing:.08em;text-transform:uppercase}
.hc em{font:12px system-ui;color:#fffc;font-style:normal;line-height:1.3}
@media (orientation:landscape) and (max-height:480px){.hc{width:132px}.hc img{width:84px;height:84px}}
.pill.ghost{background:#0b1626;color:#ffe7a3;box-shadow:0 0 0 1px #ffd86a}
/* end screen + model loader */
.end{position:absolute;inset:0;display:none;place-items:center;background:#000a;z-index:5}
.end.on{display:grid}
.end .card{display:grid;gap:10px;justify-items:center;padding:18px 20px;border-radius:16px;background:linear-gradient(#1d3557,#0b1626);box-shadow:0 0 0 2px #ffd86a,0 10px 30px #000}
.end h2{margin:0;font:900 22px Cinzel,Georgia,serif;color:#ffe7a3}
.pill{border:0;border-radius:99px;padding:10px 22px;font:900 14px Cinzel,Georgia,serif;color:#2b1d0e;background:linear-gradient(#ffe7a3,#d9a53a);box-shadow:0 4px 0 #6b4a1a}
.gear{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 84px);z-index:4;width:34px;height:34px;border-radius:50%;border:0;background:#0b1626cc;color:#ffe7a3;font-size:16px;box-shadow:0 0 0 1px #ffd86a77;pointer-events:auto}
.load{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 124px);z-index:4;display:none;gap:6px;flex-direction:column;padding:10px;border-radius:12px;background:#0b1626ee;box-shadow:0 0 0 1px #ffd86a77;font-size:12px}
.load.on{display:flex}
.load label{display:flex;justify-content:space-between;gap:8px;align-items:center}
.load input{font-size:11px;max-width:160px;color:#fff}
</style>

const $=id=>document.getElementById(id);
function hud(){[A,B].forEach((f,i)=>{$('hp'+i).style.width=Math.max(0,f.hp)+'%';$('hu'+i).style.width=Math.max(0,f.hp)+'%';$('m'+i).firstElementChild.style.width=f.meter+'%';$('m'+i).classList.toggle('full',f.meter>=100)});
  $('bS').classList.toggle('ready',A.meter>=100);$('clock').textContent=Math.max(0,Math.ceil(G.time));$('clock').classList.toggle('low',G.time<6)}
function big(t,ms=900){const b=$('big');b.textContent=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');clearTimeout(big.k);big.k=setTimeout(()=>b.classList.remove('on'),ms)}
function popDmg(f,n,cls){const v=new THREE.Vector3(f.x,1.9*f.look.scale,0).project(cam),r=view.getBoundingClientRect(),d=document.createElement('div');
  d.className='dmg '+(cls||'');d.textContent=cls==='blk'?'BLOCK':'−'+n;d.style.left=(v.x+1)/2*r.width+'px';d.style.top=(1-v.y)/2*r.height+'px';view.appendChild(d);setTimeout(()=>d.remove(),800)}

/* ================= magic (signature specials) ================= */
const fx=[];                                                      // short-lived 3D effects: {obj, life, max, tick}
function addFx(obj,life,tick){scene.add(obj);fx.push({obj,life,max:life,tick})}
function setStone(f,on){if(!f.body)return;f.body.traverse(o=>{if(!o.isMesh)return;const ms=Array.isArray(o.material)?o.material:[o.material];
  ms.forEach(m=>{if(!m.color)return;if(on){m.userData.c0=m.userData.c0||m.color.clone();m.color.setRGB(.62,.62,.6)}else if(m.userData.c0)m.color.copy(m.userData.c0)})})}
const MAGIC={
  quake(at,df){const r=new THREE.Mesh(new THREE.TorusGeometry(.4,.06,8,48),new THREE.MeshBasicMaterial({color:0xffd86a,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    r.rotation.x=Math.PI/2;r.position.set(at.x+at.dir*.8,.05,0);addFx(r,.6,(o,k)=>{o.scale.setScalar(1+(1-k)*7);o.material.opacity=k});G.shake=.4;burst(df.x,.3,50,0xffd86a)},
  stare(at,df){const a=new THREE.Vector3(at.x+at.dir*.15,1.65*at.look.scale,0),b=new THREE.Vector3(df.x,1.5*df.look.scale,0),len=a.distanceTo(b);
    const beam=new THREE.Mesh(new THREE.CylinderGeometry(.05,.11,len,10,1,true),new THREE.MeshBasicMaterial({color:0x19e070,transparent:true,opacity:.85,depthWrite:false}));   // Gorgon-green (not additive: stays green on bright sand)
    beam.position.copy(a).lerp(b,.5);beam.rotation.z=Math.PI/2;addFx(beam,.5,(o,k)=>{o.material.opacity=k;o.scale.x=k});
    df.stun=1.3;df.move=null;setStone(df,true);if(df.mixer)df.mixer.timeScale=0;burst(df.x,1.4,30,0x7dffa8)},
  charge(at,df){df.vx+=at.dir*9;G.shake=.35;burst(df.x,1,46,0x6ab8ff)}};

/* ================= the fight ================= */
const G={time:30,state:'intro',slow:1,shake:0,zoom:0,stop:0};
function resolve(at,df){const m=at.mv[at.move],dist=Math.abs(at.x-df.x);if(dist>m.reach*(at.look.scale>1?1.08:1))return;
  at.hitDone=true;const blocked=df.st==='block'&&at.move!=='special';let d=blocked?Math.round(m.dmg*.15):m.dmg;
  const hx=(at.x+df.x)/2,hy=1.35*df.look.scale;
  if(blocked){sfx('block');burst(hx,hy,14,0x9cc8ff);popDmg(df,0,'blk');df.vx+=at.dir*m.push*3}
  else{sfx('hit',at.move==='light'?.5:1);burst(hx,hy,at.move==='light'?18:40,at.move==='special'?0xc88aff:0xffc86a);popDmg(df,d,at.move!=='light'?'crit':'');
    df.move=null;df.set('hit');df.vx+=at.dir*m.push*6;G.stop=at.move==='light'?.05:.09;G.shake=at.move==='light'?.08:.22;if(at.move!=='light'){$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on')}
    at.meter=Math.min(100,at.meter+(at.move==='light'?12:18));df.meter=Math.min(100,df.meter+6)}
  if(at.move==='special'&&MAGIC[at.look.magic])MAGIC[at.look.magic](at,df,blocked);
  df.hp-=d;if(df.hp<=0)finish(at,df)}
function finish(w,l){if(G.state!=='fight')return;G.state='ko';l.hp=0;l.move=null;l.set('ko');sfx('ko');G.slow=.22;G.zoom=1;big('K.O.',1600);
  setTimeout(()=>{G.slow=1;w.move=null;w.set('win')},1300);
  setTimeout(()=>{const won=w===A,s=$('stamp');s.className='stamp '+(won?'':'lose');s.textContent=won?'VICTORY':'DEFEATED';void s.offsetWidth;s.classList.add('on')},1500);
  setTimeout(()=>{$('endt').textContent=w===A?'Victory!':'Defeated';$('ends').textContent=`${A.look.name} ${Math.max(0,Math.round(A.hp))} HP · ${B.look.name} ${Math.max(0,Math.round(B.hp))} HP`;$('end').classList.add('on')},3000)}
function reset(){[A,B].forEach(f=>{if(f.stun){f.stun=0;setStone(f,false);if(f.mixer)f.mixer.timeScale=1}});[A,B].forEach((f,i)=>{f.hp=100;f.meter=0;f.x=i?1.3:-1.3;f.vx=f.wv=0;f.move=null;f.set('idle')});G.time=30;G.state='intro';G.zoom=0;
  $('end').classList.remove('on');$('stamp').classList.remove('on');hud();big('ROUND 1',900);setTimeout(()=>{big('FIGHT!',700);G.state='fight'},1100)}

/* ================= bot brain (the Minotaur) ================= */
let botT=0;
function bot(dt){botT-=dt;const d=Math.abs(A.x-B.x);
  if(B.st==='block'&&botT<=0)B.set('idle');
  if(A.move==='heavy'&&A.t<.2&&B.canAct()&&Math.random()<.04){B.set('block');botT=.45;return}            // reads the telegraphed heavy
  if(botT>0||!B.canAct())return;
  if(d>1.6){B.set('walkF');botT=.12;return}
  const r=Math.random();
  if(B.meter>=100&&r<.5){B.start('special');botT=.6}
  else if(r<.42){B.start('light');botT=.35+Math.random()*.25}
  else if(r<.6){B.start('heavy');botT=.7}
  else if(r<.78){B.set('block');botT=.5}
  else {B.set('walkB');botT=.25}}

/* ================= input: buttons + gestures ================= */
const IN={L:0,R:0,blk:0};
function hold(id,on,off){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();ac();b.classList.add('dn');on()});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>{b.classList.remove('dn');off&&off()}))}
/* joystick: the base jumps under the thumb; knob offset drives IN.L / IN.R, pulling down blocks */
(()=>{const zone=$('jzone'),joy=$('joy'),knob=$('knob');let id=null,cx=0,cy=0;
  const z=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--z'))||1;
  const setK=(dx,dy)=>{knob.style.translate=`${dx}px ${dy}px`};
  const rest=()=>{joy.style.left=joy.style.bottom='';joy.classList.remove('on');setK(0,0);IN.L=IN.R=0;IN.blk=IN.bB||0;IN.jb=0};
  zone.addEventListener('pointerdown',e=>{e.preventDefault();ac();id=e.pointerId;zone.setPointerCapture(id);const Z=z();
    cx=e.clientX;cy=e.clientY;joy.style.left=Math.max(8,cx/Z-75)+'px';joy.style.bottom=Math.max(8,(innerHeight-cy)/Z-75)+'px';   // keep the base fully on screen
    cx=Math.max(cx,(8+75)*Z);cy=Math.min(cy,innerHeight-(8+75)*Z);joy.classList.add('on');move(e)});
  const move=e=>{if(e.pointerId!==id)return;const Z=z();let dx=(e.clientX-cx)/Z,dy=(e.clientY-cy)/Z;const r=Math.hypot(dx,dy),mx=48;
    if(r>mx){dx*=mx/r;dy*=mx/r}setK(dx,dy);IN.R=dx>14?1:0;IN.L=dx<-14?1:0;IN.jb=dy>30&&Math.abs(dx)<30?1:0;IN.blk=IN.jb||IN.bB||0};
  zone.addEventListener('pointermove',move);['pointerup','pointercancel'].forEach(t=>zone.addEventListener(t,e=>{if(e.pointerId===id){id=null;rest()}}))})();
hold('bB',()=>{IN.bB=1;IN.blk=1},()=>{IN.bB=0;IN.blk=IN.jb||0});hold('bA',()=>act('light'));hold('bH',()=>act('heavy'));hold('bS',()=>act('special'));
function act(k){if(G.state!=='fight')return;A.start(k)}
let g0=null;                                                    // arena gestures
R.domElement.addEventListener('pointerdown',e=>{ac();if(e.clientX<innerWidth*.42)return;g0={x:e.clientX,y:e.clientY,t:performance.now(),blk:false}});
R.domElement.addEventListener('pointermove',e=>{if(!g0)return;const dy=e.clientY-g0.y;if(dy>40&&!g0.blk){g0.blk=true;IN.blk=1}});
R.domElement.addEventListener('pointerup',e=>{if(!g0)return;const dy=e.clientY-g0.y,dt=performance.now()-g0.t;
  if(g0.blk)IN.blk=0;else if(dy<-40)act('special');else if(dt>350)act('heavy');else act('light');g0=null});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')IN.L=1;if(k==='arrowright'||k==='d')IN.R=1;if(k==='s'||k==='arrowdown')IN.blk=1;if(k==='j')act('light');if(k==='k')act('heavy');if(k==='l')act('special')});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')IN.L=0;if(k==='arrowright'||k==='d')IN.R=0;if(k==='s'||k==='arrowdown')IN.blk=0});
$('again').onclick=reset;$('change').onclick=()=>{$('end').classList.remove('on');openSel()};
const STYLE_N={brawler:'Brawler',blade:'Blade'};
function openSel(){G.state='select';$('selg').innerHTML=Object.entries(ROSTER).map(([k,H])=>`<button class="hc" data-k="${k}"><img src="${H.img}" alt=""><b>${H.name}</b><i>${STYLE_N[H.style]}</i><em>${H.mg}</em></button>`).join('');
  $('sel').classList.add('on');$('selg').querySelectorAll('.hc').forEach(b=>b.onclick=()=>{ac();setHero(b.dataset.k);$('sel').classList.remove('on');reset()})}$('gear').onclick=()=>$('load').classList.toggle('on');
const loader=new GLTFLoader();
loader.load('minotaur.json',g=>{B.useGLB(g);B.set(B.st)},undefined,()=>{});setHero('heracles');   // real Meshy fighters   // real Meshy fighters
[0,1].forEach(i=>$('f'+i).onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);
  loader.load(u,g=>{const names=(i?B:A).useGLB(g);$('clips').textContent=(i?'Enemy':'Hero')+' clips: '+(names.join(', ')||'none');URL.revokeObjectURL(u)},undefined,err=>$('clips').textContent='Could not load: '+err.message)});

/* ================= main loop ================= */
const clock=new THREE.Clock();let time=0;
function size(){const r=view.getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();uiScale()}
/* UI scale: some hosts show the page zoomed-out on phones (layout wider than the real screen).
   k = layout px per real screen px, so buttons keep their real finger size; z also shrinks the
   two thumb clusters when they would not fit side by side (portrait). */
function uiScale(){const W=innerWidth,H=innerHeight,land=W>H,
    u=land?H/400:W/400,                                   // reference: 400 px short side (landscape) / width (portrait)
    z=Math.min(3,Math.max(.5,land?u:u*.82)),k=Math.min(3,Math.max(.6,land?Math.min(u,W/760):u));
  const st=document.documentElement.style;st.setProperty('--k',k.toFixed(3));st.setProperty('--z',z.toFixed(3))}
setTimeout(()=>$('hint').classList.add('off'),6000);                 // gesture tip fades out
$('rot').onclick=()=>$('rot').classList.add('off');                  // rotate tip can be dismissed
addEventListener('resize',size);size();
function step(f,o,dt){f.t+=dt;
  if(f.stun>0){f.stun-=dt;if(f.stun<=0){f.stun=0;setStone(f,false);if(f.mixer)f.mixer.timeScale=1;f.set('idle')}}       // Medusa's Gaze wears off
  if(f.move==='special'&&f.look.magic==='charge'&&!f.dashed&&f.t>f.mv.special.w*.6){f.dashed=1;f.vx+=f.dir*7;burst(f.x,.4,24,0x6ab8ff)}   // Bull Rush lunge
  if(f.move!=='special')f.dashed=0;
  if(f===A&&G.state==='fight'){if(f.canAct()){if(IN.blk)f.st!=='block'&&f.set('block');else if(IN.R)f.st!=='walkF'&&f.set('walkF');else if(IN.L)f.st!=='walkB'&&f.set('walkB');else if(f.st!=='idle')f.set('idle')}}
  const tv=f.st==='walkF'?f.dir*1.6:f.st==='walkB'?-f.dir*1.2:0;f.wv=(f.wv||0)+(tv-(f.wv||0))*Math.min(1,dt*12);   // walk speed eases in/out
  f.x+=(f.wv+f.vx)*dt;f.vx*=Math.exp(-dt*9);                                       // knockback slides and settles
  if(f.move){const m=f.mv[f.move];if(!f.hitDone&&f.t>m.w&&f.t<m.w+m.a&&G.state==='fight')resolve(f,o);if(f.t>=m.w+m.a+m.r){f.move=null;f.set('idle')}}
  if(f.st==='hit'&&f.t>.32)f.set('idle');
  const gap=.9*(f.look.scale+o.look.scale)/2;                    // fighters never overlap
  f.x=THREE.MathUtils.clamp(f.x,-4.2,4.2);if(f.side===0)f.x=Math.min(f.x,o.x-gap);else f.x=Math.max(f.x,o.x+gap);
  f.root.position.x=f.x;f.root.rotation.y=f.mixer?(f.dir>0?0:Math.PI):(f.dir>0?Math.PI/2:-Math.PI/2);
  if(f.mixer)f.mixer.update(dt);else f.pose(dt,time)}
function loop(){requestAnimationFrame(loop);for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.life-=1/60;e.tick(e.obj,Math.max(0,e.life/e.max));if(e.life<=0){scene.remove(e.obj);fx.splice(i,1)}}const raw=Math.min(.05,clock.getDelta());let dt=raw*G.slow;
  if(G.stop>0){G.stop-=raw;dt*=.08}                                                   // hit-stop: impacts feel heavy, not jerkytime+=dt;
  if(G.state==='fight'){G.time-=dt;bot(dt);if(G.time<=0)finish(A.hp>=B.hp?A:B,A.hp>=B.hp?B:A)}
  step(A,B,dt);step(B,A,dt);
  torches.forEach((l,i)=>l.intensity=5.5+Math.sin(time*9+i*2)*1.2+Math.random()*.6);
  sparks.forEach(s=>{s.life-=raw;const p=s.pts.geometry.attributes.position;for(let i=0;i<s.v.length;i++){s.v[i].y-=9*raw;p.setXYZ(i,p.getX(i)+s.v[i].x*raw,p.getY(i)+s.v[i].y*raw,p.getZ(i)+s.v[i].z*raw)}p.needsUpdate=true;s.pts.material.opacity=Math.max(0,s.life*2)});
  for(let i=sparks.length-1;i>=0;i--)if(sparks[i].life<=0){scene.remove(sparks[i].pts);sparks.splice(i,1)}
  // camera: keep both fighters framed, push in on the K.O., shake on big hits
  const mid=(A.x+B.x)/2,span=Math.abs(A.x-B.x)+2.6,hf=Math.tan(THREE.MathUtils.degToRad(cam.fov/2));
  let z=Math.max(4.2,(span/2)/(hf*cam.aspect)+.6);if(G.zoom)z=THREE.MathUtils.lerp(z,3.2,.6);
  const sx=(Math.random()-.5)*G.shake,sy=(Math.random()-.5)*G.shake;G.shake*=Math.exp(-raw*9);
  wall.position.x=cam.position.x*.6;cam.position.lerp(new THREE.Vector3(mid+sx,1.55+sy+(G.zoom?-.2:0),z),1-Math.exp(-raw*7));cam.lookAt(mid,1.15,0);scene.fog.near=cam.position.z+3;scene.fog.far=cam.position.z+8;
  hud();R.render(scene,cam)}
openSel();loop();window.FT={A,B,G,IN};   // handle for automated tests
</script>
